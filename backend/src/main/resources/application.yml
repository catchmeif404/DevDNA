spring:
  application:
    name: devdna-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devwrapped}
    username: ${DB_USER:devwrapped}
    password: ${DB_PASSWORD:devwrapped}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            # 실제 GitHub OAuth App을 만들기 전까지는 더미 값으로 기동만 가능하게 한다.
            # (Spring Boot 4의 OAuth2ClientProperties는 빈 client-id를 기동 실패로 처리한다.)
            client-id: ${GITHUB_CLIENT_ID:dummy-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-client-secret}
            scope: read:user
            redirect-uri: "{baseUrl}/api/auth/{registrationId}/callback"

server:
  port: ${PORT:8080}
  # Railway (and most PaaS) terminate TLS at the edge and proxy to the container over plain
  # HTTP, so without this Spring reconstructs {baseUrl} as http:// from the request it actually
  # sees - breaking the OAuth2 redirect_uri (GitHub rejects it as a mismatch against the https://
  # callback URL registered on the OAuth App). This makes Spring trust X-Forwarded-Proto/Host/Port.
  forward-headers-strategy: framework

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3010}
  # Optional - unset means every collector request is unauthenticated and shares GitHub's very
  # low per-IP rate limit across all users. A classic PAT with no scopes checked is enough (this
  # only ever reads public data). See collector.GithubApiClient.
  github:
    token: ${GITHUB_API_TOKEN:}
