services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devwrapped
      POSTGRES_USER: devwrapped
      POSTGRES_PASSWORD: devwrapped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devwrapped"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8090:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devwrapped
      DB_USER: devwrapped
      DB_PASSWORD: devwrapped
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dummy-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dummy-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devwrapped
      DB_USER: devwrapped
      DB_PASSWORD: devwrapped
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3010:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
